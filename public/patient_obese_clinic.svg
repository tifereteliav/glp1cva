<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>

    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="nurseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.15"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clinic Consultation Room Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Clinic Wall Decor & Panel -->
  <rect x="40" y="30" width="720" height="540" rx="24" fill="url(#cardGrad)" stroke="#bae6fd" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Top Wall Medical Status Banner -->
  <rect x="70" y="55" width="660" height="65" rx="16" fill="#0284c7"/>
  <text x="400" y="93" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" text-anchor="middle">
    מפגש מרפאה: יעקב (בן 67) • פרופיל השמנה BMI 36.1 (משקל 96 ק"ג)
  </text>

  <!-- Medical Monitor Display in Background -->
  <g transform="translate(480, 140)">
    <rect width="220" height="150" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <rect x="10" y="10" width="200" height="130" rx="8" fill="#1e293b"/>
    <text x="110" y="38" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">נתוני ניטור קליני</text>
    <line x1="20" y1="48" x2="200" y2="48" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="75" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="700">משקל בסיס: 96 kg</text>
    <text x="30" y="98" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="900">BMI: 36.1 (השמנה)</text>
    <text x="30" y="120" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="700">גובה: 163 cm</text>
  </g>

  <!-- Left Side: Nurse Character -->
  <g transform="translate(100, 150)">
    <!-- Nurse Chair -->
    <rect x="30" y="240" width="100" height="160" rx="12" fill="#cbd5e1"/>
    <!-- Nurse Body -->
    <path d="M 40, 220 Q 80, 160 120, 220 L 130, 370 L 30, 370 Z" fill="url(#nurseGrad)"/>
    <!-- Nurse Coat Collar -->
    <path d="M 65, 195 L 80, 240 L 95, 195 Z" fill="#ffffff"/>
    <!-- Nurse Head -->
    <circle cx="80" cy="150" r="35" fill="#fbcfe8"/>
    <!-- Nurse Hair -->
    <path d="M 45, 145 C 45, 110 115, 110 115, 145 C 115, 125 45, 125 45, 145 Z" fill="#475569"/>
    <!-- Stethoscope -->
    <path d="M 60, 200 Q 80, 260 100, 200" stroke="#f59e0b" stroke-width="5" fill="none"/>
    <circle cx="80" cy="245" r="8" fill="#f59e0b"/>
    <!-- Label -->
    <rect x="25" y="380" width="110" height="30" rx="15" fill="#0d9488"/>
    <text x="80" y="400" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">אחות מרפאה</text>
  </g>

  <!-- Right Side: Obese Patient Yaakov (BMI 36.1) -->
  <g transform="translate(320, 140)">
    <!-- Examination Chair for Obese Patient -->
    <rect x="20" y="240" width="220" height="180" rx="16" fill="#94a3b8"/>
    <rect x="230" y="160" width="30" height="240" rx="10" fill="#64748b"/>
    
    <!-- Obese Body - Pronounced Abdominal Roundness for BMI 36.1 -->
    <!-- Large Rounded Abdomen Shadow -->
    <ellipse cx="120" cy="285" rx="105" ry="95" fill="#0284c7" opacity="0.2"/>
    <!-- Obese Torso & Abdomen -->
    <path d="M 30, 210 Q 120, 160 210, 210 Q 240, 290 210, 360 L 30, 360 Q -0, 290 30, 210 Z" fill="url(#shirtGrad)"/>
    <!-- Shirt Buttons / Creases on Belly -->
    <circle cx="120" cy="240" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="120" cy="275" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="120" cy="310" r="4" fill="#ffffff" opacity="0.8"/>
    
    <!-- Arms resting on knees/chair -->
    <path d="M 30, 220 Q 0, 280 40, 320" stroke="#0369a1" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M 210, 220 Q 240, 280 200, 320" stroke="#0369a1" stroke-width="24" stroke-linecap="round" fill="none"/>

    <!-- Head & Face -->
    <circle cx="120" cy="140" r="42" fill="#fed7aa"/>
    <!-- Double Chin / Fuller Face Contour -->
    <ellipse cx="120" cy="165" rx="36" ry="18" fill="#fdba74"/>
    <!-- Gray Hair (67yo) -->
    <path d="M 78, 135 C 78, 90 162, 90 162, 135 C 162, 110 78, 110 78, 135 Z" fill="#94a3b8"/>
    <!-- Gentle Expression & Glasses -->
    <circle cx="106" cy="135" r="10" stroke="#334155" stroke-width="2" fill="none"/>
    <circle cx="134" cy="135" r="10" stroke="#334155" stroke-width="2" fill="none"/>
    <line x1="116" y1="135" x2="124" y2="135" stroke="#334155" stroke-width="2"/>
    <path d="M 108, 158 Q 120, 166 132, 158" stroke="#334155" stroke-width="2.5" fill="none"/>

    <!-- Prominent BMI 36 Badge Overlay -->
    <g transform="translate(30, 375)">
      <rect width="180" height="42" rx="21" fill="url(#badgeGrad)" filter="url(#glow)"/>
      <text x="90" y="26" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" text-anchor="middle">
        יעקב • BMI 36.1 (השמנה)
      </text>
    </g>
  </g>

  <!-- Bottom Info Bar -->
  <g transform="translate(80, 525)">
    <rect width="640" height="32" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
    <text x="320" y="21" fill="#0369a1" font-family="sans-serif" font-size="13" font-weight="800" text-anchor="middle">
      פגישת הערכה ומעקב מרפאה • השמנה משמעותית (96 ק"ג, 163 ס"מ) • CVA 2023 &amp; IHD
    </text>
  </g>
</svg>
